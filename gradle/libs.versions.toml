[versions]
# libraries
paper = "26.3.build.223-stable"
placeholderapi = "2.12.3"
luckperms = "5.4"
configurate = "4.2.0"
junit = "6.1.3"
mockito = "5.24.0"
mcmsgdef = "1.3.0"

# gradle plugins
gradle-plugins = "1.8.6"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }

configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
mcmsgdef = { module = "dev.siroshun.mcmsgdef:mcmsgdef", version.ref = "mcmsgdef" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]

jcommon = { id = "dev.siroshun.gradle.plugins.jcommon", version.ref = "gradle-plugins" }
bundler = { id = "dev.siroshun.gradle.plugins.bundler", version.ref = "gradle-plugins" }
